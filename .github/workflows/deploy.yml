# Every push to main rebuilds the app and publishes it to GitHub Pages, so a
# change made from anywhere — a laptop, a phone — is live at the same URL a
# minute later. Nothing here needs a machine of ours to be switched on.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      # If an Android build has been published, carry it into the site, so the
      # apk has a link on the game's own address instead of a GitHub page.
      - name: Include the Android app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download apk --pattern 'Game7.apk' --dir dist --clobber 2>/dev/null; then
            ls -lh dist/Game7.apk
          else
            echo 'no apk published yet — the site goes out without one'
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
