# THE OLD ADDRESS IS THE MOVER NOW (his word, 2026-10-22: "yes replace github.io with the mover").
#
# The game lives at https://game7draft.com (cloudflare-pages.yml). This workflow keeps
# https://tomereinan-create.github.io/Game7/ serving the MOVER: a page that reads the save a player
# left at the old address and carries it to the new one (#import), plus a service worker that
# replaces the game's on every phone that installed it. It builds the mover — never the game — on
# every push to main, so no later push can put the old game back over it.
#
# KEEP IT LIVE UNTIL AT LEAST 2027-04-22. Phones that played at the old address can only reach their
# progress through here. Do not delete this workflow, the repository's Pages site, or the mover's
# files (mover/, scripts/build-mover.mjs) before then.
name: Deploy the mover to GitHub Pages (the old address)

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the mover
        run: node scripts/build-mover.mjs

      # The mover must point at the new domain, carry the link preview, and be the only thing here.
      - name: Check the mover
        run: |
          set -eu
          for f in index.html 404.html sw.js .nojekyll; do test -f "dist-mover/$f" || { echo "missing dist-mover/$f"; exit 1; }; done
          grep -q 'og:url" content="https://game7draft.com/"' dist-mover/index.html
          grep -q 'og:image" content="https://game7draft.com/og-image.png"' dist-mover/index.html
          grep -q 'import=' dist-mover/index.html
          if [ -d dist-mover/assets ]; then echo "the game's bundle is in the mover"; exit 1; fi
          echo "the mover is sound"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist-mover'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
