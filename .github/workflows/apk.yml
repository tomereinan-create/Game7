# Builds a sideloadable Android APK. The whole game goes inside it — the web
# build is copied into the package — so it runs with no network at all, unlike
# the installed web app which needs one first visit.
#
# Nothing here is installed on anyone's machine: the runner already has the JDK
# and the Android SDK. Run it from the Actions tab.
name: apk

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish it as a public download link (a GitHub release)'
        type: boolean
        default: true

# Only the newest push is worth an apk; the release it publishes replaces the
# one before it anyway.
concurrency:
  group: apk
  cancel-in-progress: true

permissions:
  contents: write
  actions: write   # to nudge the site workflow once the apk exists

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci
      - run: npm run build
      # Android will only install a new apk over an old one when both carry the
      # same signature. Gradle's debug build signs with ~/.android/debug.keystore,
      # and a runner starts without one — so every build was minting a fresh key
      # and every update would have demanded an uninstall, taking the player's
      # saved runs with it. The first build here makes one key and commits it;
      # every build after uses it.
      #
      # The password is `android`, the documented default the Android plugin
      # expects. It is not a secret, and this is a debug key for a sideloaded
      # game — it grants nothing beyond signing this package.
      - name: One signing key, kept
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ -f keystore/debug.keystore ]; then
            echo 'the key is already in the repo'
            exit 0
          fi
          mkdir -p keystore
          keytool -genkeypair -noprompt             -keystore keystore/debug.keystore             -storepass android -keypass android -alias androiddebugkey             -keyalg RSA -keysize 2048 -validity 10950             -dname 'CN=Game7, O=Game7, C=US'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add keystore/debug.keystore
          git commit -q -m 'apk: one signing key, so a new build installs over the old app'
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main             || echo 'could not push the key — the next build will try again'


      - name: Generate the Android project
        run: npx cap add android
      - name: Draw the launcher icon
        run: node scripts/make-android-icons.mjs

      - name: Copy the build into it
        run: npx cap sync android

      - name: Assemble
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Gradle would not take the keystore either way — not left at
      # ~/.android/debug.keystore, not named in the DSL. Three builds came out as
      # CN=Android Debug with a different key each time, which is the one thing
      # that must not happen: a new key means an update will not install over the
      # app already on the phone. So the signature is replaced here by the tool
      # whose only job is signing, and the step fails if it did not take.
      - name: Sign it with the kept key
        run: |
          set -eu
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$apksigner" sign --ks keystore/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --v1-signing-enabled true --v2-signing-enabled true "$apk"

          want=$(keytool -list -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: *//p' | head -1 | tr -d ': ' | tr '[:lower:]' '[:upper:]')
          got=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: *//p' | head -1 | tr -d ': ' | tr '[:lower:]' '[:upper:]')
          echo "keystore says $want"
          echo "the apk says  $got"
          if [ -z "$got" ] || [ "$want" != "$got" ]; then
            echo "not signed with the kept key; an update would not install"
            exit 1
          fi

      - name: Name it after the commit
        id: apk
        run: |
          set -eu
          src=android/app/build/outputs/apk/debug/app-debug.apk
          out="Game7-${GITHUB_SHA::7}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: Game7-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # An artifact can only be downloaded by someone signed in with access to
      # the repo, and arrives as a zip. A release asset is a plain link that
      # anyone can tap — which is the point of building an apk at all.
      - name: Publish a download link
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A fixed name, because the site links to it and that link should not
          # change with every build.
          cp "${{ steps.apk.outputs.path }}" Game7.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Game7.apk --title 'Game7 (Android)' --notes 'Sideloadable debug build. Android warns about installing outside the Play Store; allow it for your browser or files app, then open the file.'

          # The site copies the apk in at build time, so it has to run again now
          # that there is one to copy.
          gh workflow run deploy.yml --ref main || true
          gh workflow run publish.yml --ref main || true
          echo "apk published; the site will carry it once the deploy finishes"
