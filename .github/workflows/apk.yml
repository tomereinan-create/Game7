# Builds a sideloadable Android APK. The whole game goes inside it — the web
# build is copied into the package — so it runs with no network at all, unlike
# the installed web app which needs one first visit.
#
# Nothing here is installed on anyone's machine: the runner already has the JDK
# and the Android SDK. Run it from the Actions tab.
name: apk

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish it as a public download link (a GitHub release)'
        type: boolean
        default: true

# Only the newest push is worth an apk; the release it publishes replaces the
# one before it anyway.
concurrency:
  group: apk
  cancel-in-progress: true

permissions:
  contents: write
  actions: write   # to nudge the site workflow once the apk exists

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci
      - run: npm run build

      - name: Generate the Android project
        run: npx cap add android

      - name: Draw the launcher icon
        run: node scripts/make-android-icons.mjs

      - name: Copy the build into it
        run: npx cap sync android

      - name: Assemble
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name it after the commit
        id: apk
        run: |
          set -eu
          src=android/app/build/outputs/apk/debug/app-debug.apk
          out="Game7-${GITHUB_SHA::7}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: Game7-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # An artifact can only be downloaded by someone signed in with access to
      # the repo, and arrives as a zip. A release asset is a plain link that
      # anyone can tap — which is the point of building an apk at all.
      - name: Publish a download link
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A fixed name, because the site links to it and that link should not
          # change with every build.
          cp "${{ steps.apk.outputs.path }}" Game7.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Game7.apk --title 'Game7 (Android)' --notes 'Sideloadable debug build. Android warns about installing outside the Play Store; allow it for your browser or files app, then open the file.'

          # The site copies the apk in at build time, so it has to run again now
          # that there is one to copy.
          gh workflow run deploy.yml --ref main || true
          gh workflow run publish.yml --ref main || true
          echo "apk published; the site will carry it once the deploy finishes"
