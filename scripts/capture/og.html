<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Space+Grotesk:wght@400;500;700&display=block" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background:
          radial-gradient(70% 90% at 78% 50%, rgb(240 179 35 / 0.14), transparent 60%),
          radial-gradient(120% 120% at 20% 0%, #211c15, #0b0a09 65%);
        color: #f6f4ef;
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      /* the court, faint: an arc and the lane, so the card reads as basketball without a logo */
      .court { position: absolute; inset: 0; opacity: 0.09; }
      .left { position: absolute; left: 64px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
      .name { font: 400 132px/0.86 'League Gothic', sans-serif; text-transform: uppercase; letter-spacing: 0.01em; }
      .name em { font-style: normal; color: #f0b323; }
      .tag { font: 500 31px/1.22 'Space Grotesk', sans-serif; color: #f6f4ef; max-width: 520px; }
      .small { font: 500 17px/1.3 'Space Grotesk', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: #a39a91; }
      .right { position: absolute; right: 64px; top: 50%; transform: translateY(-50%); width: 470px; display: flex; flex-direction: column; gap: 22px; }
      .wheel { border: 3px solid #f0b323; border-radius: 14px; background: #12100e; padding: 18px 18px 20px; box-shadow: 0 24px 60px rgb(0 0 0 / 0.55); }
      .cap { display: flex; justify-content: space-between; font: 700 13px/1 'Space Grotesk', sans-serif; letter-spacing: 0.2em; text-transform: uppercase; color: #a39a91; margin-bottom: 12px; }
      .reels { display: flex; gap: 12px; }
      .reel { position: relative; border: 1px solid #2c2721; border-radius: 10px; background: #0f0d0b; overflow: hidden; }
      .reel.team { flex: 1; }
      .reel.year { width: 132px; }
      .row { height: 46px; display: flex; align-items: center; padding: 0 20px; font: 500 21px/1 'Space Grotesk', sans-serif; color: #6f675e; white-space: nowrap; }
      .row.lit { color: #f6f4ef; background: rgb(240 179 35 / 0.16); border-top: 1px solid rgb(240 179 35 / 0.5); border-bottom: 1px solid rgb(240 179 35 / 0.5); font-weight: 700; }
      .row.lit::before { content: ''; border-left: 10px solid #f0b323; border-top: 7px solid transparent; border-bottom: 7px solid transparent; margin-right: 12px; }
      .reel::before, .reel::after { content: ''; position: absolute; left: 0; right: 0; height: 40%; pointer-events: none; }
      .reel::before { top: 0; background: linear-gradient(#0f0d0b, transparent); }
      .reel::after { bottom: 0; background: linear-gradient(transparent, #0f0d0b); }
      .bug { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgb(0 0 0 / 0.55); }
      .side { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; }
      .side.you { background: #f0b323; color: #16130f; }
      .side.them { background: #ef4a63; color: #fff; }
      .side b { font: 400 30px/1 'League Gothic', sans-serif; letter-spacing: 0.04em; }
      .side span { font: 400 60px/1 'League Gothic', sans-serif; }
      .mid { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 16px; background: #0b0a09; }
      .mid b { font: 400 34px/1 'League Gothic', sans-serif; color: #f6f4ef; letter-spacing: 0.04em; }
      .mid i { font: 700 12px/1 'Space Grotesk', sans-serif; font-style: normal; letter-spacing: 0.2em; color: #a39a91; margin-top: 4px; }
    </style>
  </head>
  <body>
    <svg class="court" viewBox="0 0 1200 630" aria-hidden="true">
      <g fill="none" stroke="#f6f4ef" stroke-width="3">
        <path d="M640 630 V470 A300 300 0 0 1 1200 470 V630" />
        <rect x="830" y="420" width="180" height="210" />
        <circle cx="920" cy="420" r="90" />
      </g>
    </svg>
    <div class="left">
      <div class="name">%NAME_HTML%</div>
      <div class="tag">Spin the wheel. Draft five real players. Survive Game&nbsp;7.</div>
      <div class="small">Every season since 1980 · free in your browser</div>
    </div>
    <div class="right">
      <div class="wheel">
        <div class="cap"><span>Spin 1 of 5 — it lands on</span><span>Year</span></div>
        <div class="reels">
          <div class="reel team">
            <div class="row">San Antonio Spurs</div>
            <div class="row lit">Chicago Bulls</div>
            <div class="row">Detroit Pistons</div>
          </div>
          <div class="reel year">
            <div class="row">1995</div>
            <div class="row lit">1996</div>
            <div class="row">1997</div>
          </div>
        </div>
      </div>
      <div class="bug">
        <div class="side you"><b>YOU</b><span>101</span></div>
        <div class="mid"><b>GAME 7</b><i>FINAL</i></div>
        <div class="side them"><span>100</span><b>CHI</b></div>
      </div>
    </div>
  </body>
</html>
