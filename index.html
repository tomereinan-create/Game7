<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0a09" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Game7" />
    <!-- Not black-translucent: that draws the app under the status bar, and the
         layout only insets the bottom, so the home button and the sticky header
         would sit beneath the notch. Black reserves the bar and matches #0b0a09. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Courier Prime came off on 2026-09-10 with the chalk playbook. It had exactly one caller in
         the whole stylesheet — --ck-type, the front door's typeface — and that block is the flow
         board's door screen now, in the app's own two faces. A render-blocking request for a family
         nothing draws is worse than a missing one. -->
    <link
      href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Game7</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
