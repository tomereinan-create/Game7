<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Every %SITE_*% / %OG_*% below is written at build time from src/site.ts (vite.config.ts,
         `sitePages`): the product is named in one place, so a rename never touches a page. -->
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESC%" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta name="theme-color" content="%SITE_THEME%" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="application-name" content="%SITE_SHORT%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%SITE_SHORT%" />
    <!-- Not black-translucent: that draws the app under the status bar, and the
         layout only insets the bottom, so the home button and the sticky header
         would sit beneath the notch. Black reserves the bar and matches the theme. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- THE LINK PREVIEW (P4). A link pasted into a chat, a bio or a comment rendered bare; these
         give it a title, a sentence and the 1200x630 picture (public/og-image.png, made by
         scripts/capture/stills.mjs). Absolute URLs, because a preview crawler reads them cold. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%OG_TITLE%" />
    <meta property="og:description" content="%SITE_DESC%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%OG_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%OG_TITLE%" />
    <meta name="twitter:description" content="%SITE_DESC%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <meta name="twitter:image:alt" content="%OG_ALT%" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Courier Prime came off on 2026-09-10 with the chalk playbook. It had exactly one caller in
         the whole stylesheet — --ck-type, the front door's typeface — and that block is the flow
         board's door screen now, in the app's own two faces. A render-blocking request for a family
         nothing draws is worse than a missing one. -->
    <link
      href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html { background: %SITE_THEME%; }
      body:has(> #root > .boot) { margin: 0; }
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; box-sizing: border-box; color: #f6f4ef; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; background: radial-gradient(70% 50% at 50% 42%, #2a2117, %SITE_THEME% 70%); }
      .boot-ball { width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f6a65a, #d8642a 60%, #9c3f16); box-shadow: 0 10px 30px rgb(0 0 0 / 0.5); position: relative; animation: boot-bounce 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite alternate; }
      .boot-ball::before, .boot-ball::after, .boot-ball i { content: ""; position: absolute; background: rgb(40 18 6 / 0.55); }
      .boot-ball::before { left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; }
      .boot-ball::after { top: 50%; left: 0; right: 0; height: 2px; margin-top: -1px; }
      .boot-ball i { inset: 8px 18px; background: none; border: 2px solid rgb(40 18 6 / 0.45); border-radius: 50%; }
      .boot-name { margin-top: 8px; font-weight: 800; font-size: 34px; letter-spacing: 0.06em; text-transform: uppercase; }
      .boot-line { font-size: 15px; color: #f0b323; letter-spacing: 0.04em; }
      .boot-sub { font-size: 12px; color: #a39a91; letter-spacing: 0.12em; text-transform: uppercase; }
      @keyframes boot-bounce { from { transform: translateY(-10px); } to { transform: translateY(10px); } }
      @media (prefers-reduced-motion: reduce) { .boot-ball { animation: none; } }
    </style>
    <!--CF_BEACON-->
  </head>
  <body>
    <!-- THE LOADING SHELL (the live check, 2026-10-22: on slow 4G a visitor from a video stared at an
         empty dark screen for ~10 s while the one big bundle downloaded). Plain HTML and inline CSS,
         painted with the first bytes; React replaces it the moment the game mounts. -->
    <div id="root">
      <div class="boot" aria-live="polite">
        <div class="boot-ball" aria-hidden="true"><i></i></div>
        <div class="boot-name">%SITE_NAME%</div>
        <div class="boot-line">Loading the wheel…</div>
        <div class="boot-sub">Every season since 1980 · free in your browser</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
